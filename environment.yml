name: world_model_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - r-base
  - r-essentials
  - jupyter
  - pip
  - pip:
      # --- inference backends ---
      - transformers            # HF backend
      - accelerate              # device_map="auto" sharding for >30B models
      - transformer_lens        # TransformerLens backend
      - vllm                    # batched-inference backend
      - huggingface_hub
      - datasets
      # --- API models ---
      - openai                  # OpenAI + DeepSeek (OpenAI-compatible)
      - google-genai            # Gemini
      # --- analysis ---
      - pandas
      - numpy
      - scipy
      - scikit-learn
      - statsmodels
      - networkx                # attention-graph betweenness measure
      - nltk                    # Brown-corpus trigram frequencies
      - matplotlib
      - plotly
      # --- misc ---
      - ipython
      - jaxtyping
      - torchtyping
      - tqdm
      - nbformat
variables:
  # Where models are cached. Override per machine; on CHTC the job wrapper
  # points this at job scratch so nothing lands in /home.
  CACHE_DIR: ""
